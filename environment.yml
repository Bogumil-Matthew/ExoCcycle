name: exoccycle-GMD
channels:
  - conda-forge
  - nodefaults

dependencies:
  # ---- Core Python ----
  - python=3.10
  - setuptools==70.3.0
  - jupyter
  - ipykernel
  - nb_conda_kernels

  # ---- Numeric / Sci stack ----
  - numpy>=1.26
  - scipy>=1.10
  - pandas>=1.5
  - scikit-learn
  - tqdm

  # ---- NetCDF / HDF I/O ----
  - netcdf4
  - cftime
  - hdf5
  - libnetcdf

  # ---- Plotting / Viz ----
  - matplotlib
  - plotly
  - cmcrameri>=1.9

  # ---- Geospatial stack (needed by Cartopy) ----
  - cartopy
  - shapely>=2
  - proj
  - proj-data
  - geos
  - pyproj
  - pygplates

  # ---- Graph / Community detection ----
  - networkx
  - python-igraph
  - leidenalg
  - louvain
  - cdlib  # includes cdlib.evaluation and NodeClustering

  # ---- GMT + wrapper (PyGMT pulls GMT runtime libs too) ----
  - gmt>=6.2,<7
  - pygmt<0.17

  # ---- Sphinx docs toolchain (optional but handy here) ----
  - sphinx>=7
  - myst-parser
  - sphinx-copybutton
  - sphinx-autodoc-typehints
  - sphinx-rtd-theme

  # ---- Misc runtime niceties ----
  - pip
  - pip:
      - copernicusmarine>=2.0
